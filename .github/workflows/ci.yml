name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Format check
        run: test -z "$(gofmt -l *.go)"
      - name: Unit tests
        run: go test ./...
      - name: Build dynamic plugin
        run: CGO_ENABLED=1 go build -buildmode=c-shared -o /tmp/cliproxy-antigravity.so .
      - name: ABI smoke test
        run: python3 scripts/abi_smoke.py /tmp/cliproxy-antigravity.so
