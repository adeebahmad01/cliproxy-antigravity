name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache: false
      - uses: github/codeql-action/init@v3
        with:
          languages: go
          build-mode: manual
      - name: Build
        run: CGO_ENABLED=1 go build -buildmode=c-shared -o "$RUNNER_TEMP/plugin.so" .
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:go"
