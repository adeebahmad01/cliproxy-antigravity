name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            ext: so
          - os: macos-latest
            ext: dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Test
        run: go test ./...
      - name: Build
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -buildmode=c-shared -o "dist/cliproxy-antigravity-${{ runner.os }}-${{ runner.arch }}.${{ matrix.ext }}" .
          rm -f dist/*.h
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ runner.os }}-${{ runner.arch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
